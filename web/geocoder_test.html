<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geocoder 测试 — Google Maps</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 10px 14px; background: #1a73e8; color: #fff; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 500; }
  header input, header select, header button { padding: 6px 10px; border-radius: 4px; border: none; font-size: 13px; }
  header input { flex: 1; min-width: 200px; }
  header button { background: #fff; color: #1a73e8; cursor: pointer; font-weight: 500; }
  header button:hover { background: #e8f0fe; }
  header select { color: #202124; }
  main { flex: 1; display: flex; min-height: 0; }
  #left { width: 380px; min-width: 320px; background: #f8f9fa; border-right: 1px solid #dadce0; display: flex; flex-direction: column; overflow: hidden; }
  #results { flex: 1; overflow-y: auto; padding: 8px; }
  .r { padding: 10px 12px; background: #fff; margin-bottom: 6px; border-radius: 6px; border: 1px solid #dadce0; cursor: pointer; transition: background 0.15s; }
  .r:hover { background: #e8f0fe; }
  .r.hl { background: #e8f0fe; border-color: #1a73e8; }
  .r .n { font-size: 14px; font-weight: 500; color: #202124; }
  .r .m { font-size: 11px; color: #5f6368; margin-top: 2px; }
  .r .b { font-size: 11px; color: #1a73e8; margin-top: 2px; }
  #right { flex: 1; position: relative; }
  #map { width: 100%; height: 100%; }
  #info { position: absolute; bottom: 12px; left: 12px; max-width: 360px; max-height: 50%; overflow-y: auto; background: rgba(255,255,255,0.97); padding: 10px 12px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); font-size: 12px; display: none; z-index: 10; }
  #info h3 { margin: 0 0 6px 0; font-size: 13px; color: #1a73e8; }
  #info .row { padding: 4px 0; border-bottom: 1px solid #f1f3f4; }
  #info .row:last-child { border: none; }
  #info .tag { display: inline-block; background: #e8f0fe; color: #1a73e8; padding: 1px 6px; border-radius: 3px; font-size: 10px; margin-right: 4px; }
  #status { padding: 6px 12px; background: #f1f3f4; border-top: 1px solid #dadce0; font-size: 11px; color: #5f6368; display: flex; gap: 12px; }
  #status span { white-space: nowrap; }
  #empty { color: #80868b; text-align: center; padding: 30px 12px; font-size: 12px; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #1a73e8; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>Geocoder 测试</h1>
  <input id="q" placeholder="输入地名 (中/英), 例: 仰光 / Yangon / 阿卜耶伊" autocomplete="off">
  <select id="cc"><option value="">全部</option><option>MM</option><option>TH</option><option>VN</option><option>ID</option><option>PH</option><option>MY</option><option>KH</option><option>LA</option><option>NG</option><option>KE</option><option>EG</option><option>MA</option><option>SA</option><option>IR</option><option>IQ</option><option>AE</option><option>IL</option><option>TR</option><option>CN</option></select>
  <select id="lang"><option value="zh">中文</option><option value="en">English</option></select>
  <button id="go">搜索</button>
</header>
<main>
  <div id="left">
    <div id="results"><div id="empty">输入地名或点击地图测试</div></div>
    <div id="status">
      <span id="st_api">API: 127.0.0.1:8000</span>
      <span id="st_count">结果: 0</span>
      <span id="st_elapsed">耗时: -</span>
    </div>
  </div>
  <div id="right">
    <div id="map"></div>
    <div id="info"></div>
  </div>
</main>

<script>
const API = 'http://127.0.0.1:8000';
const GMAP_KEY = 'AIzaSyDyoj6rRSqmFF20-F89cKhditWELSIXr-I';
let map, markers = [];

function initMap() {
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 22.0, lng: 96.0 }, zoom: 5,
    mapTypeControl: true, streetViewControl: false, fullscreenControl: true
  });
  map.addListener('click', e => doReverse(e.latLng.lat(), e.latLng.lng()));
}

async function api(path, params) {
  const u = new URL(API + path);
  for (const [k, v] of Object.entries(params)) if (v !== '' && v != null) u.searchParams.set(k, v);
  const r = await fetch(u.toString());
  return r.json();
}

function clearMarkers() {
  markers.forEach(m => m.setMap(null));
  markers = [];
}

function setMarker(p, title, hl) {
  const m = new google.maps.Marker({
    position: { lat: p.lat, lng: p.lon }, map, title: title || p.name,
    icon: hl ? 'http://maps.google.com/mapfiles/ms/icons/blue-dot.png' : null
  });
  if (p.name) m.addListener('click', () => showInfo(p));
  markers.push(m);
  return m;
}

function showInfo(p) {
  document.getElementById('info').style.display = 'block';
  let h = `<h3>${esc(p.name || '?')}</h3>`;
  h += `<div class="row"><span class="tag">id</span>${p.id} <span class="tag">${esc(p.source || '')}</span>`;
  if (p.cc) h += ` <span class="tag">${esc(p.cc)}</span>`;
  if (p.placetype) h += ` <span class="tag">${esc(p.placetype)}</span>`;
  h += `</div>`;
  if (p.admin1) h += `<div class="row">📍 ${esc(p.admin1)}</div>`;
  h += `<div class="row">📐 ${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}</div>`;
  if (p.pop) h += `<div class="row">👥 ${p.pop.toLocaleString()}</div>`;
  if (p.fcode) h += `<div class="row">🏷️ ${esc(p.fcode)}</div>`;
  if (p.score != null) h += `<div class="row">⭐ score: ${p.score}</div>`;
  document.getElementById('info').innerHTML = h;
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function doSearch() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const cc = document.getElementById('cc').value;
  const lang = document.getElementById('lang').value;
  const t0 = performance.now();
  document.getElementById('results').innerHTML = '<div id="empty"><span class="spinner"></span> 搜索中...</div>';
  document.getElementById('info').style.display = 'none';
  clearMarkers();
  try {
    const data = await api('/geocode', { q, cc, lang, limit: 20 });
    const ms = Math.round(performance.now() - t0);
    document.getElementById('st_elapsed').textContent = '耗时: ' + ms + 'ms';
    document.getElementById('st_count').textContent = '结果: ' + (data.count || 0);
    if (!data.results || data.results.length === 0) {
      document.getElementById('results').innerHTML = '<div id="empty">无结果</div>';
      return;
    }
    const html = data.results.map((p, i) => `
      <div class="r" data-i="${i}">
        <div class="n">${esc(p.name || '(无)')}</div>
        <div class="m">${esc(p.cc || '')} · ${esc(p.placetype || '')} · ${(p.lat||0).toFixed(3)}, ${(p.lon||0).toFixed(3)}</div>
        ${p.admin1 ? `<div class="b">📍 ${esc(p.admin1)}</div>` : ''}
        ${p.pop ? `<div class="m">👥 ${p.pop.toLocaleString()}</div>` : ''}
      </div>`).join('');
    document.getElementById('results').innerHTML = html;
    document.querySelectorAll('.r').forEach(el => {
      const i = +el.dataset.i;
      const p = data.results[i];
      el.addEventListener('click', () => {
        document.querySelectorAll('.r').forEach(e => e.classList.remove('hl'));
        el.classList.add('hl');
        clearMarkers();
        setMarker(p, p.name, true);
        showInfo(p);
        map.setCenter({ lat: p.lat, lng: p.lon });
        map.setZoom(Math.max(map.getZoom(), 8));
      });
      const m = setMarker(p, p.name, false);
      if (i === 0) { m.setIcon('http://maps.google.com/mapfiles/ms/icons/blue-dot.png'); map.setCenter({ lat: p.lat, lng: p.lon }); map.setZoom(8); }
    });
  } catch (e) {
    document.getElementById('results').innerHTML = '<div id="empty">错误: ' + esc(e.message) + '<br>确认 geocoder 后端在 ' + API + '</div>';
  }
}

async function doReverse(lat, lon) {
  const lang = document.getElementById('lang').value;
  const t0 = performance.now();
  try {
    const data = await api('/reverse', { lat, lon, lang, radius_m: 10000 });
    const ms = Math.round(performance.now() - t0);
    document.getElementById('st_elapsed').textContent = '耗时: ' + ms + 'ms';
    document.getElementById('st_count').textContent = '点击: ' + lat.toFixed(3) + ',' + lon.toFixed(3);
    clearMarkers();
    setMarker({ lat, lon, name: '点击位置', id: '-', source: 'click' }, '点击位置', true);
    let h = '<h3>Reverse 结果</h3>';
    h += `<div class="row">📐 ${lat.toFixed(5)}, ${lon.toFixed(5)}</div>`;
    if (data.nearest) {
      const n = data.nearest;
      h += `<div class="row"><b>最近 POI:</b> ${esc(n.name)} <span class="tag">${esc(n.placetype||'')}</span> <span class="tag">${esc(n.cc||'')}</span></div>`;
      h += `<div class="row">距离: ${n.dist_m}m${n.admin1 ? ' · 📍 ' + esc(n.admin1) : ''}</div>`;
      setMarker({ lat: n.lat, lon: n.lon, ...n }, n.name, false);
      map.setCenter({ lat: n.lat, lng: n.lon });
    }
    if (data.admin && data.admin.length) {
      h += '<div class="row"><b>行政链:</b></div>';
      data.admin.slice(0, 6).forEach(a => {
        h += `<div class="row">  ${esc(a.placetype||'?')}: <b>${esc(a.name)}</b> <span class="tag">${esc(a.cc||'')}</span> ${a.dist_m}m</div>`;
      });
    }
    document.getElementById('info').style.display = 'block';
    document.getElementById('info').innerHTML = h;
  } catch (e) {
    document.getElementById('info').style.display = 'block';
    document.getElementById('info').innerHTML = '<h3>错误</h3><div class="row">' + esc(e.message) + '</div>';
  }
}

document.getElementById('go').addEventListener('click', doSearch);
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
document.getElementById('lang').addEventListener('change', () => {
  if (document.getElementById('q').value.trim()) doSearch();
});
</script>
<script async defer
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDyoj6rRSqmFF20-F89cKhditWELSIXr-I&callback=initMap&v=weekly">
</script>
</body>
</html>
